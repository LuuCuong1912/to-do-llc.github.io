<!--
  Phần <head> DÙNG CHUNG cho mọi trang. Sửa ở đây rồi chạy: npm run sync:head
  Khi chép vào các trang, các chú thích (như khối này) và dòng trống được bỏ đi → trang gọn.

  - preload font: tải font Jost ngay từ đầu (font tự host trong assets/fonts, khai báo @font-face ở base.css)
  - 4 file CSS chung: giữ riêng, KHÔNG gộp bằng @import — đo thực tế (độ trễ 150 ms) gộp làm hiển thị chậm ~160 ms
  - modulepreload: tải song song các module mà trang nào cũng dùng — đo thực tế nhanh hơn ~170 ms
-->
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="/assets/fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
