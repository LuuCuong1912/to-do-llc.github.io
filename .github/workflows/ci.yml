# CI: mỗi lần push / mở Pull Request, GitHub tự kiểm tra chất lượng code và chạy toàn bộ test.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

# Push liên tiếp lên cùng nhánh → hủy lượt chạy cũ, chỉ giữ lượt mới nhất
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ESLint · Prettier · <head> chung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:head

  test:
    name: Unit · Tích hợp (MySQL) · E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: todopro_test
          MYSQL_USER: todopro
          MYSQL_PASSWORD: todopro
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: todopro
      DB_PASSWORD: todopro
      DB_NAME: todopro_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend

      - name: Unit test (không cần DB)
        run: npm test
        working-directory: backend

      - name: Tạo bảng + dữ liệu gói
        run: npm run db:setup
        working-directory: backend

      - name: Test tích hợp (MySQL thật)
        run: npm run test:integration
        working-directory: backend

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Test E2E (Playwright)
        run: npm run test:e2e

      - name: Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
